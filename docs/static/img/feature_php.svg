<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="feat-php-title">
  <title id="feat-php-title">Code-Editor mit PHP-Quelltext</title>
  <circle cx="100" cy="104" r="88" fill="#6dac20" opacity="0.12"/>
  <!-- editor window -->
  <rect x="18" y="40" width="164" height="124" rx="10" fill="#2b2f36"/>
  <path d="M18 50 Q18 40 28 40 H172 Q182 40 182 50 V60 H18 Z" fill="#3a3f48"/>
  <circle cx="32" cy="50" r="4" fill="#ff5f57"/>
  <circle cx="45" cy="50" r="4" fill="#febc2e"/>
  <circle cx="58" cy="50" r="4" fill="#28c840"/>
  <!-- code lines -->
  <text x="30" y="80" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8892bf">&lt;?php</text>
  <g stroke-linecap="round" stroke-width="6">
    <line x1="30" y1="94" x2="62" y2="94" stroke="#8892bf"/>
    <line x1="70" y1="94" x2="120" y2="94" stroke="#6dac20"/>
    <line x1="42" y1="108" x2="80" y2="108" stroke="#c9ccd1"/>
    <line x1="88" y1="108" x2="140" y2="108" stroke="#e9c46a"/>
    <line x1="42" y1="122" x2="96" y2="122" stroke="#6dac20"/>
    <line x1="104" y1="122" x2="126" y2="122" stroke="#c9ccd1"/>
    <line x1="30" y1="136" x2="44" y2="136" stroke="#8892bf"/>
  </g>
  <!-- cursor -->
  <rect x="52" y="131" width="3" height="11" fill="#ffffff"/>
  <!-- plus badge: "einfach erweiterbar" -->
  <g transform="translate(152 138)">
    <circle r="16" fill="#6dac20"/>
    <path d="M0 -8 V8 M-8 0 H8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
